name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Fix Groovy issue
        run: |
          FLUTTER_PATH=$(find /opt/hostedtoolcache/flutter -name "flutter.groovy" -path "*/gradle/*" | head -1)
          echo "Found: $FLUTTER_PATH"
          sed -i 's|^import groovy.xml.QName$|import javax.xml.namespace.QName|' "$FLUTTER_PATH"
          sed -i 's|new XmlParser()|new groovy.xml.XmlParser()|' "$FLUTTER_PATH"
          echo "Fixed!"
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayya-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
